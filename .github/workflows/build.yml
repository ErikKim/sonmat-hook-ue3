# dshaptics_ue3_x86.dll (32-bit Unreal 3 games): every push builds it (artifact); a tag v* also puts the zip on a release, which is where the app fetches
# it from (sonmat-games/parts.json: the zip's address + SHA-256, then sonmat tools/partfetch.py).
name: build
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: MinHook (pinned)
        shell: pwsh
        run: |
          git init -q minhook
          git -C minhook fetch -q --depth 1 https://github.com/TsudaKageyu/minhook.git 8af6b4acae5a9388fd742b56fa79ece89d96f823
          git -C minhook checkout -q FETCH_HEAD
      - name: Build
        shell: pwsh
        run: |
          cmd /c "build.bat dshaptics_ue3 x86"; if ($LASTEXITCODE -ne 0 -or -not (Test-Path dshaptics_ue3_x86.dll)) { throw "dshaptics_ue3_x86.dll did not build" }
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pack | Out-Null
          Copy-Item dshaptics_ue3_x86.dll, LICENSE pack/; Copy-Item minhook/LICENSE.txt pack/MinHook-LICENSE.txt
          $v = if ("${{ github.ref }}" -like "refs/tags/v*") { "${{ github.ref_name }}".Substring(1) } else { "dev" }
          Compress-Archive -Path pack/* -DestinationPath "sonmat-hook-ue3-$v.zip" -Force
          "zip: sonmat-hook-ue3-$v.zip sha256 $((Get-FileHash "sonmat-hook-ue3-$v.zip" -Algorithm SHA256).Hash.ToLower())"
      - uses: actions/upload-artifact@v4
        with:
          name: sonmat-hook-ue3
          path: sonmat-hook-ue3-*.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $z = Get-Item sonmat-hook-ue3-*.zip
          $hash = (Get-FileHash $z -Algorithm SHA256).Hash.ToLower()
          gh release create "${{ github.ref_name }}" $z.FullName --title "sonmat-hook-ue3 ${{ github.ref_name }}" --notes "SHA-256 $hash (the value for sonmat-games/parts.json)"
